apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/library/app_tp_devops-tp-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
