services:

  tp-mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - tp-network

  tp-backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    networks:
      - tp-network
    depends_on:
      - tp-mongo
    ports:
      - 5000:5000
  
  tp-frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    networks:
      - tp-network
    depends_on:
      - tp-backend 
    ports:
      - 3000:3000


volumes:
  mongo-data:
    external: true
    name: tp-mongo-data

networks:
  tp-network:
    external: true
    name: tp-network